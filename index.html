<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prospect Map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#142033;--muted:#667085;--line:#d9e0ea;--blue:#1769e0;--blue2:#0d4ca3}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{height:70px;background:#101828;color:#fff;padding:14px 18px}header h1{margin:0;font-size:21px}header p{margin:3px 0 0;color:#cbd5e1;font-size:13px}
.app{height:calc(100vh - 70px);display:grid;grid-template-columns:350px minmax(0,1fr)}
.sidebar{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}select,input,button,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink)}button{font-weight:700;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.secondary{background:#eef4ff;border-color:#c9dcff;color:var(--blue2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{font-size:12px;line-height:1.45;color:var(--muted)}#status{font-size:12px;color:var(--muted);margin:8px 0}.prospects{display:grid;gap:8px}.prospect{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbfcfe}.prospect b{display:block}.badge{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:999px;background:#edf2f7;color:#475467;font-size:11px}.actions{display:flex;gap:6px;margin-top:8px}.actions button{padding:7px;font-size:12px}
.mapwrap{position:relative;min-width:0;background:#dfeaf5}.map{width:100%;height:100%}.loading{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:900;background:#fff;border-radius:999px;padding:8px 12px;box-shadow:0 2px 12px rgba(0,0,0,.14);font-size:12px;display:none}.legend{position:absolute;right:14px;bottom:14px;z-index:800;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e53935;margin-right:5px}
#error{display:none;background:#fff4e5;border:1px solid #ffd59a;color:#8a4b00;border-radius:10px;padding:9px;font-size:12px;line-height:1.4;margin-top:8px}.fallback{display:none}.fallback button{margin-top:6px}
@media(max-width:800px){.app{display:flex;flex-direction:column;height:auto}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.mapwrap{height:58vh;min-height:420px}.row{grid-template-columns:1fr 1fr}header{height:auto}}
</style>
</head>
<body>
<header><h1>Prospect Map</h1><p>Prospection commerciale — Europe, pays, régions et prospects</p></header>
<div class="app">
<aside class="sidebar">
  <div class="card">
    <label>Pays</label><select id="country"><option value="">— Choisir un pays —</option></select>
    <div style="height:8px"></div><label>Région</label><select id="region" disabled><option value="">— Choisir une région —</option></select>
    <div style="height:8px"></div><button class="secondary" id="back">↩ Vue Europe</button>
    <div id="error"></div>
  </div>
  <div class="card">
    <div id="selection"><b>Aucune zone sélectionnée</b></div>
    <div class="hint" id="selectionHint">Clique sur un pays puis sur une région. Tu peux aussi utiliser les listes.</div>
  </div>
  <div class="card">
    <label>Recherche</label><input id="search" placeholder="Entreprise, ville, activité…">
    <div style="height:8px"></div><label>Activité</label><select id="activity"><option value="">Toutes les activités</option><option>Agroalimentaire</option><option>Industrie</option><option>Maintenance industrielle</option><option>Installateur électrique</option><option>Tableautier</option><option>Constructeur de machines</option><option>Distributeur</option><option>Autre</option></select>
  </div>
  <div class="card">
    <div class="row"><button class="primary" id="add">+ Ajouter</button><button class="secondary" id="export">Exporter</button></div>
    <button style="margin-top:8px" id="clear">Effacer les prospects</button>
  </div>
  <div class="card"><div id="status">0 prospect</div><div id="prospects" class="prospects"></div></div>
</aside>
<main class="mapwrap"><div id="map" class="map"></div><div id="loading" class="loading">Chargement…</div><div class="legend"><span class="dot"></span> Prospect</div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';
const EUROPE=new Set(['ALB','AND','AUT','BEL','BGR','BIH','BLR','CHE','CYP','CZE','DEU','DNK','ESP','EST','FIN','FRA','GBR','GRC','HRV','HUN','IRL','ISL','ITA','LIE','LTU','LUX','LVA','MDA','MKD','MLT','MNE','NLD','NOR','POL','PRT','ROU','SMR','SRB','SVK','SVN','SWE','UKR','VAT','RUS','TUR','GEO','ARM','AZE','XKX']);
const NAMES={ALB:'Albanie',AND:'Andorre',AUT:'Autriche',BEL:'Belgique',BGR:'Bulgarie',BIH:'Bosnie-Herzégovine',BLR:'Biélorussie',CHE:'Suisse',CYP:'Chypre',CZE:'Tchéquie',DEU:'Allemagne',DNK:'Danemark',ESP:'Espagne',EST:'Estonie',FIN:'Finlande',FRA:'France',GBR:'Royaume-Uni',GRC:'Grèce',HRV:'Croatie',HUN:'Hongrie',IRL:'Irlande',ISL:'Islande',ITA:'Italie',LIE:'Liechtenstein',LTU:'Lituanie',LUX:'Luxembourg',LVA:'Lettonie',MDA:'Moldavie',MKD:'Macédoine du Nord',MLT:'Malte',MNE:'Monténégro',NLD:'Pays-Bas',NOR:'Norvège',POL:'Pologne',PRT:'Portugal',ROU:'Roumanie',SMR:'Saint-Marin',SRB:'Serbie',SVK:'Slovaquie',SVN:'Slovénie',SWE:'Suède',UKR:'Ukraine',VAT:'Vatican',RUS:'Russie',TUR:'Turquie',GEO:'Géorgie',ARM:'Arménie',AZE:'Azerbaïdjan',XKX:'Kosovo'};
const COUNTRY_URL='https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson';
const REGION_URL=iso=>'https://cdn.jsdelivr.net/gh/layrayson/geo-atlas-data@main/data/'+iso+'/admin1-simplified.geojson';
const $=id=>document.getElementById(id), error=$('error');
let map=null,countryLayer=null,regionLayer=null,prospectLayer=null,countries=[],selectedCountry='',selectedRegion='';
let prospects=[];try{prospects=JSON.parse(localStorage.getItem('prospectMapDataV2')||'[]')}catch(e){prospects=[]}
function msg(t){error.textContent=t;error.style.display='block'}
function hideMsg(){error.style.display='none'}
function loading(v){$('loading').style.display=v?'block':'none'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function save(){try{localStorage.setItem('prospectMapDataV2',JSON.stringify(prospects))}catch(e){}}
function iso(f){return String(f.properties.ISO_A3||f.properties.ADM0_A3||'').toUpperCase()}
function fname(f){return f.properties.ADMIN||f.properties.NAME||f.properties.name||''}
function cstyle(){return {color:'#64748b',weight:1,fillColor:'#cfe0f5',fillOpacity:.8}}
function csel(){return {color:'#1769e0',weight:3,fillColor:'#8fbaff',fillOpacity:.9}}
function rstyle(){return {color:'#64748b',weight:1,fillColor:'#e7eef7',fillOpacity:.65}}
function rsel(){return {color:'#1769e0',weight:3,fillColor:'#83aff5',fillOpacity:.9}}
function fitEurope(){if(map)map.fitBounds([[35,-12],[72,42]],{padding:[10,10]})}
function render(){
  if(!prospectLayer)return; prospectLayer.clearLayers();
  const q=$('search').value.trim().toLowerCase(), a=$('activity').value;
  const list=prospects.filter(p=>(!q||(`${p.name} ${p.city} ${p.activity} ${p.notes} ${p.country} ${p.region}`).toLowerCase().includes(q))&&(!a||p.activity===a));
  $('status').textContent=list.length+' prospect'+(list.length>1?'s':'');
  $('prospects').innerHTML=list.map(p=>`<div class="prospect"><b>${esc(p.name)}</b><span>${esc(p.city||'')}</span><br><span class="badge">${esc(p.activity||'Autre')}</span>${p.country?` <span class="badge">${esc(p.country)}</span>`:''}<div class="actions"><button onclick="window.focusP('${p.id}')">Voir</button><button onclick="window.editP('${p.id}')">Modifier</button><button onclick="window.deleteP('${p.id}')">Supprimer</button></div></div>`).join('')||'<div class="hint">Aucun prospect pour ces filtres.</div>';
  prospects.forEach(p=>{if(Number.isFinite(p.lat)&&Number.isFinite(p.lng)){L.marker([p.lat,p.lng]).bindPopup('<b>'+esc(p.name)+'</b><br>'+esc(p.activity||'')+'<br>'+esc(p.city||'')).addTo(prospectLayer)}})
}
function fillCountries(data){
  countries=data.features.filter(f=>EUROPE.has(iso(f)));
  const sel=$('country');sel.innerHTML='<option value="">— Choisir un pays —</option>';
  countries.slice().sort((a,b)=>(NAMES[iso(a)]||fname(a)).localeCompare(NAMES[iso(b)]||fname(b),'fr')).forEach(f=>{const o=document.createElement('option');o.value=iso(f);o.textContent=NAMES[iso(f)]||fname(f);sel.appendChild(o)})
}
async function loadRegions(code){
  $('region').disabled=true;$('region').innerHTML='<option>Chargement des régions…</option>';loading(true);
  try{
    const r=await fetch(REGION_URL(code),{cache:'force-cache'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();
    if(regionLayer)map.removeLayer(regionLayer);
    regionLayer=L.geoJSON(data,{style:rstyle,onEachFeature:(f,l)=>{const n=f.properties.name||f.properties.NAME||f.properties.region||'Région';l.bindTooltip(n);l.on('mouseover',e=>e.target.setStyle({weight:2,fillOpacity:.9}));l.on('mouseout',e=>{if(selectedRegion!==n)e.target.setStyle(rstyle())});l.on('click',()=>selectRegion(n,l))}}).addTo(map);
    const s=$('region');s.innerHTML='<option value="">— Choisir une région —</option>';data.features.forEach(f=>{const n=f.properties.name||f.properties.NAME||f.properties.region||'Région';const o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o)});s.disabled=false;$('selectionHint').textContent='Clique sur une région ou choisis-la dans la liste.';
  }catch(e){$('region').innerHTML='<option value="">Régions indisponibles</option>';$('selectionHint').textContent='Les limites régionales ne sont pas disponibles pour ce pays. Le reste de l’application fonctionne.'}
  finally{loading(false)}
}
function selectRegion(n,l){selectedRegion=n;$('region').value=n;$('selection').innerHTML='<b>'+esc(NAMES[selectedCountry]||selectedCountry)+'</b> — '+esc(n);if(regionLayer)regionLayer.eachLayer(x=>x.setStyle(x===l?rsel():rstyle()));}
async function selectCountry(code){
  hideMsg();selectedCountry=code;selectedRegion='';$('country').value=code;$('selection').innerHTML='<b>'+esc(NAMES[code]||code)+'</b>';$('selectionHint').textContent='Chargement des régions…';
  if(countryLayer)countryLayer.eachLayer(l=>l.setStyle(iso(l.feature)===code?csel():cstyle()));
  const f=countries.find(x=>iso(x)===code);if(f)map.fitBounds(L.geoJSON(f).getBounds(),{padding:[35,35]});
  await loadRegions(code);
}
function initMap(){
  if(typeof L==='undefined'){msg('La bibliothèque de carte n’a pas pu être chargée. Recharge la page avec une connexion internet.');return false}
  map=L.map('map',{zoomControl:true,minZoom:3});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
  prospectLayer=L.layerGroup().addTo(map);fitEurope();return true
}
async function start(){
  if(!initMap())return;
  loading(true);
  try{const r=await fetch(COUNTRY_URL,{cache:'force-cache'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();fillCountries(data);countryLayer=L.geoJSON({type:'FeatureCollection',features:countries},{style:cstyle,onEachFeature:(f,l)=>{const code=iso(f),n=NAMES[code]||fname(f);l.bindTooltip(n);l.on('mouseover',e=>e.target.setStyle({weight:2,fillOpacity:.95}));l.on('mouseout',e=>{if(selectedCountry!==code)e.target.setStyle(cstyle())});l.on('click',()=>selectCountry(code))}}).addTo(map);fitEurope();hideMsg();}
  catch(e){msg('La carte géographique n’a pas pu charger ses données. Utilise la liste Pays si elle apparaît, ou recharge la page.');fillCountries({features:[]})}
  finally{loading(false);render()}
}
$('country').addEventListener('change',e=>{if(e.target.value)selectCountry(e.target.value)});
$('region').addEventListener('change',e=>{const n=e.target.value;if(!regionLayer||!n)return;regionLayer.eachLayer(l=>{const rn=l.feature.properties.name||l.feature.properties.NAME||l.feature.properties.region||'';if(rn===n){selectRegion(n,l);map.fitBounds(l.getBounds(),{padding:[35,35]})}})});
$('back').addEventListener('click',()=>{selectedCountry='';selectedRegion='';$('country').value='';$('region').disabled=true;$('region').innerHTML='<option value="">— Choisir une région —</option>';if(regionLayer){map.removeLayer(regionLayer);regionLayer=null}if(countryLayer)countryLayer.eachLayer(l=>l.setStyle(cstyle()));$('selection').innerHTML='<b>Aucune zone sélectionnée</b>';$('selectionHint').textContent='Clique sur un pays puis sur une région.';fitEurope()});
$('search').addEventListener('input',render);$('activity').addEventListener('change',render);
$('add').addEventListener('click',()=>{const name=prompt('Nom de l’entreprise / prospect :');if(!name)return;const p={id:String(Date.now()),name:name.trim(),city:prompt('Ville :')||'',activity:prompt('Activité :')||'Autre',notes:prompt('Notes :')||'',country:NAMES[selectedCountry]||'',region:selectedRegion||'',lat:null,lng:null};prospects.push(p);save();render()});
$('export').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(prospects,null,2)],{type:'application/json'}));a.download='prospects.json';a.click()});
$('clear').addEventListener('click',()=>{if(confirm('Effacer tous les prospects enregistrés sur cet appareil ?')){prospects=[];save();render()}});
window.deleteP=id=>{if(confirm('Supprimer ce prospect ?')){prospects=prospects.filter(p=>p.id!==id);save();render()}};
window.editP=id=>{const p=prospects.find(x=>x.id===id);if(!p)return;const n=prompt('Nom',p.name);if(n===null)return;p.name=n;p.city=prompt('Ville',p.city)||p.city;p.activity=prompt('Activité',p.activity)||p.activity;p.notes=prompt('Notes',p.notes)||p.notes;save();render()};
window.focusP=id=>{const p=prospects.find(x=>x.id===id);if(p&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)){map.setView([p.lat,p.lng],14)}else alert('Ce prospect n’a pas encore de coordonnées GPS.')};
start();
})();
</script>
</body>
</html>
